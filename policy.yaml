# 用户指定整站删除（绕过视频保护，最高优先级）
user_remove:
  - 哔哩
  - bilibili
  - b站
  - BILIBILI

# 藤藤 / 谐音（均依赖第三方解析、手机端不可用，删除）
teng_homophone: 藤腾滕疼填瑅

# 用户点名删除的源（如 酷我 系列，从全部中移除；绕过视频保护，最高优先级）
block_names:
  - 酷我

