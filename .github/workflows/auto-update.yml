name: CS 终极出链（影视仓）

on:
  schedule:
    - cron: '0 19 * * 0'        # 每周一 北京时间 03:00（UTC 周日 19:00）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 拉 QWJS 分类 + YSC 合集，生成 5 个订阅链接
        run: python3 scripts/build.py
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch tvbox-普通.json tvbox-部分.json direct_sources.json crawler_sources.json || true
          git add 1直连-全部.json 1直连-部分.json 2爬虫-全部.json 2爬虫-部分.json 接口合集.json README.md
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto: CS 出链更新 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main || true
            git push
          fi
